name: Rails compatibility

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - rails_version: 6.0.6.1
            ruby_version: 2.7.8
            bundler_version: 2.4.22
          - rails_version: 7.2.3.2
            ruby_version: 3.4.10
            bundler_version: 2.6.9
          - rails_version: 8.0.5.1
            ruby_version: 3.4.10
            bundler_version: 2.6.9
          - rails_version: 8.1.3.1
            ruby_version: 3.4.10
            bundler_version: 2.6.9
    env:
      RAILS_VERSION: ${{ matrix.rails_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler: ${{ matrix.bundler_version }}
      - run: bundle install
      - run: bundle exec rake test
